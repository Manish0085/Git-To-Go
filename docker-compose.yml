# =============================================================================
# Git-To-Go — Production Docker Compose
#
# Usage:
#   cp .env.example .env   # fill in real values
#   docker compose up -d --build
#
# Services:
#   - postgres    : PostgreSQL 16 database
#   - backend     : Spring Boot API (Java 17)
#   - frontend    : React app served by Nginx
#   - nginx       : Reverse proxy (ports 80/443)
#   - prometheus  : Metrics collection
#   - grafana     : Monitoring dashboards
#   - cadvisor    : Container metrics
# =============================================================================

services:

  # ======================== BACKEND ========================
  # Database: AWS RDS PostgreSQL (external — not in docker-compose)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: git2go-backend
    restart: unless-stopped
    environment:
      # Database (AWS RDS)
      SPRING_DATASOURCE_URL: ${DB_URL:-jdbc:postgresql://localhost:5432/deploydb}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-64-char-secret}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      # OAuth2 (GitHub)
      GITHUB_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}

      # OAuth2 (Google)
      GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}

      # URLs — domain/IP based
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:-http://localhost/oauth2/callback}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DEPLOYMENT_BASE_URL: ${DEPLOYMENT_BASE_URL:-http://localhost}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost/api/auth/verify-email}
      WEBHOOK_BASE_URL: ${SERVER_URL:-http://localhost}

      # Email
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@git2go.com}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}

      # Encryption
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # Application
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
    volumes:
      # Mount Docker socket so backend can manage user containers
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    networks:
      - git2go-network

  # ======================== FRONTEND ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: git2go-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - git2go-network

  # ======================== NGINX REVERSE PROXY ========================
  nginx:
    image: nginx:1.27-alpine
    container_name: git2go-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL with certbot:
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    networks:
      - git2go-network

  # ======================== MONITORING ========================
  # Jenkins is installed standalone on the server (not in Docker)
  # Access: http://<SERVER_IP>:8082
  # Prometheus — metrics scrape + storage
  prometheus:
    image: prom/prometheus:latest
    container_name: git2go-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./backend/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=1GB'
    networks:
      - git2go-network

  # Grafana — dashboards and visualization
  grafana:
    image: grafana/grafana:latest
    container_name: git2go-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/monitoring/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - git2go-network

  # cAdvisor — container resource metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: git2go-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - git2go-network

# ======================== VOLUMES ========================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ======================== NETWORKS ========================
networks:
  git2go-network:
    driver: bridge
