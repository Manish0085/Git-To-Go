spring:
  application:
    name: Single-Click-Deployment-System

  # ==================== DATABASE ====================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deploydb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ==================== JPA / HIBERNATE ====================
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ==================== EMAIL (SMTP) ====================
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:noreply@example.com}
    password: ${SMTP_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ==================== OAUTH2 ====================
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:none}
            client-secret: ${GOOGLE_CLIENT_SECRET:none}
            scope: email, profile

          github:
            client-id: ${GITHUB_CLIENT_ID:none}
            client-secret: ${GITHUB_CLIENT_SECRET:none}
            scope: user:email, read:user, repo

# ==================== CUSTOM APP PROPERTIES ====================
app:
  jwt:
    secret: ${JWT_SECRET:dGVtcG9yYXJ5LWRldi1zZWNyZXQta2V5LWZvci1sb2NhbC10ZXN0aW5nLW9ubHk=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

  builds:
    base-dir: ${BUILDS_DIR:/tmp/git2go/builds}

  deployment:
    base-url: ${DEPLOYMENT_BASE_URL:http://localhost}

  email:
    from: ${EMAIL_FROM:noreply@git2go.com}
    enabled: ${EMAIL_ENABLED:true}
    verification-url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/auth/verify-email}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  logs:
    storage: ${LOG_STORAGE:file}
    base-dir: ${LOGS_DIR:/tmp/git2go/logs}
    retention-days: ${LOGS_RETENTION_DAYS:7}
    s3:
      bucket: ${S3_LOG_BUCKET:none}
      region: ${S3_LOG_REGION:ap-south-1}
      access-key: ${S3_ACCESS_KEY:none}
      secret-key: ${S3_SECRET_KEY:none}
      prefix: ${S3_LOG_PREFIX:logs/}

  webhook:
    base-url: ${WEBHOOK_BASE_URL:http://localhost:8080}

  encryption:
    key: ${ENCRYPTION_KEY:dGVtcG9yYXJ5LWVuY3J5cHRpb24ta2V5LTMyYnl0ZXM=}

# ==================== ACTUATOR + PROMETHEUS ====================
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ==================== SERVER ====================
server:
  port: ${SERVER_PORT:8080}
