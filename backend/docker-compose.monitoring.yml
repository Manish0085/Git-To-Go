# Monitoring Stack — Prometheus + Grafana + cAdvisor
# Usage: docker-compose -f docker-compose.monitoring.yml up -d
#
# After starting:
# - Prometheus: http://localhost:9090
# - Grafana: http://localhost:3001 (admin/admin)
# - cAdvisor: http://localhost:8081

services:

  # ==================== PROMETHEUS ====================
  # Time-series DB — metrics scrape + store
  prometheus:
    image: prom/prometheus:latest
    container_name: git2go-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'    # 15 days data retain
      - '--storage.tsdb.retention.size=1GB'    # Max 1GB disk usage
    networks:
      - monitoring

  # ==================== GRAFANA ====================
  # Dashboard + Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: git2go-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ==================== cAdvisor ====================
  # Container metrics collector (Google)
  # Automatically monitors ALL Docker containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: git2go-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge
